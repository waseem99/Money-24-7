name: Stocks — matte existing Marcus dialogue (ZERO HEYGEN SPEND)
on:
  pull_request:
    paths:
      - '.github/workflows/stocks-marcus-matte.yml'
jobs:
  genuine-marcu-matte:
    if: github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    timeout-minutes: 25
    permissions:
      contents: read
    env:
      HEYGEN_API_KEY: ${{ secrets.HEYGEN_API_KEY }}
    steps:
      - uses: actions/checkout@v4
      - name: Set up model dependencies
        shell: bash
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq ffmpeg
          python3 -c 'import torch, numpy' || pip3 install --quiet torch numpy --index-url https://download.pytorch.org/whl/cpu
      - name: Fetch open-source robust matting model and exact completed Marcus source
        shell: bash
        run: |
          curl -fsSL --retry 2 --max-time 180 'https://github.com/PeterL1n/RobustVideoMatting/releases/download/v1.0.0/rvm_mobilenetv3_fp32.torchscript' -o /tmp/rvm_model.torchscript
          node --input-type=module <<'JS'
          import {writeFileSync} from 'node:fs';
          const key=process.env.HEYGEN_API_KEY;
          if(!key)throw Error('Missing read-only HeyGen key');
          const id='2dd7888ccdc14636b205cf723325f47f';
          const response=await fetch('https://api.heygen.com/v3/videos/'+id,{headers:{'x-api-key':key},signal:AbortSignal.timeout(15000)});
          const data=await response.json();
          const result=data.data??data;
          if(result.status!=='completed'||!result.video_url)throw Error('Existing Marcus source not complete');
          const media=await fetch(result.video_url,{signal:AbortSignal.timeout(90000)});
          if(!media.ok)throw Error('Signed source download failed');
          const bytes=new Uint8Array(await media.arrayBuffer());
          if(bytes.length<100000||bytes.length>40000000)throw Error('Unexpected source bytes');
          writeFileSync('/tmp/stocks-marcus-original.mp4',bytes);
          console.log('MARCUS_EXISTING_SOURCE_RECOVERED='+JSON.stringify({videoId:id,sizeBytes:bytes.length,newPaidRequests:0}));
          JS
      - name: Run foreground video matte on already-generated footage
        run: |
          python3 pilot/stocks/matte-marcus.py /tmp/stocks-marcus-original.mp4 /tmp/rvm_model.torchscript /tmp/STOCKS-Marcus-True-Motion-Matted.webm
          ffmpeg -hide_banner -loglevel error -y -c:v libvpx-vp9 -ss 3.2 -i /tmp/STOCKS-Marcus-True-Motion-Matted.webm -frames:v 1 -update 1 /tmp/STOCKS-Marcus-Matte-Frame.png
          ffmpeg -v error -c:v libvpx-vp9 -i /tmp/STOCKS-Marcus-True-Motion-Matted.webm -f null -
      - uses: actions/upload-artifact@v4
        with:
          name: stocks-marcus-authentic-motion-matted-no-credits
          path: |
            /tmp/STOCKS-Marcus-True-Motion-Matted.webm
            /tmp/STOCKS-Marcus-Matte-Frame.png
          retention-days: 14
