name: MarketWatch foundation dry run
on:
  pull_request:
    paths:
      - 'automation/marketwatch/**'
      - 'tests/marketwatch*.test.mjs'
      - 'package*.json'
      - '.github/workflows/marketwatch-foundation.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  no-spend-check:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_PASSWORD: fixture-only
          POSTGRES_DB: marketwatch_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready --health-interval 10s
          --health-timeout 5s --health-retries 5
    env:
      MW_TEST_DATABASE_URL: postgres://postgres:fixture-only@localhost:5432/marketwatch_test
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - run: npm ci
      - run: npm test
      - run: npm run build
      - run: npm run marketwatch -- doctor
      # Fixed fixture date and example evidence URL: this is not today's verified calendar.
      - run: npm run marketwatch -- plan --date 2026-11-05 --market-state trading --calendar-source https://example.org/fixture-calendar
