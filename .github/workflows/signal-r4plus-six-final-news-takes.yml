name: SIGNAL R4plus — six new formal newscast voices with paid-once locks
on:
  push:
    branches: [ops/jazz-formal-anchors-20261012]
    paths: [.github/workflows/signal-r4plus-six-final-news-takes.yml]
permissions:
  contents: write
concurrency:
  group: signal-r4plus-20261012-six-news-paid-takes
  cancel-in-progress: false
jobs:
  prepare-user-approved-newscast:
    if: github.ref == 'refs/heads/ops/jazz-formal-anchors-20261012'
    runs-on: ubuntu-latest
    timeout-minutes: 18
    env:
      HEYGEN_API_KEY: ${{ secrets.HEYGEN_API_KEY }}
      GITHUB_TOKEN: ${{ github.token }}
    steps:
      - name: Secure GET preflight, six bounded once-only paid jobs, GET status; no retakes
        shell: bash
        run: |
          node --input-type=module <<'NODE'
          import {createHash} from 'node:crypto';
          import {mkdir,writeFile} from 'node:fs/promises';
          import {setTimeout as wait} from 'node:timers/promises';
          const key=process.env.HEYGEN_API_KEY,gh=process.env.GITHUB_TOKEN;
          const repo='waseem99/Money-24-7';
          const takes=[{"id":"top_stories","role":"LIZA","avatarId":"5ee67ac453c34ffebd71e8eedb47b2fe","groupId":"3727ecd034ef4248afea2a3443f7d2b7","voiceId":"330290724a1b470fb63153f34d4c0183","voiceName":"Annie","gender":"female","script":"Good morning. Welcome to Signal Market Watch. I'm Liza. A volatile start to the week: oil has pulled back, stocks are cautiously higher, and investors are bracing for major U.S. bank earnings and Wednesday's inflation report. We begin with what moved overnight."},{"id":"global_market","role":"LASSE","avatarId":"de9f36c26bd841c891489a0c9d6174de","groupId":"46782f6d3de64ed98cec7f47d3d21ae7","voiceId":"00e3d285aba44b27a83c47c02c9c2d9c","voiceName":"Orson","gender":"male","script":"Asian shares were mixed on Monday, while U.S. stock-index futures edged higher. Reuters reported Brent crude near one hundred four dollars a barrel after retreating from recent highs. That is still an expensive energy backdrop, and markets remain sensitive to every new geopolitical headline."},{"id":"earnings","role":"LIZA","avatarId":"5ee67ac453c34ffebd71e8eedb47b2fe","groupId":"3727ecd034ef4248afea2a3443f7d2b7","voiceId":"330290724a1b470fb63153f34d4c0183","voiceName":"Annie","gender":"female","script":"Now to Wall Street. Major U.S. banks begin third-quarter reporting this week. Analysts expect a strong earnings season, but the question is not simply profits. Investors will scrutinize credit losses, loan demand and management guidance for signs that higher costs are beginning to bite."},{"id":"world_outlook","role":"LIZA","avatarId":"5ee67ac453c34ffebd71e8eedb47b2fe","groupId":"3727ecd034ef4248afea2a3443f7d2b7","voiceId":"330290724a1b470fb63153f34d4c0183","voiceName":"Annie","gender":"female","script":"Beyond the United States, the IMF's World Economic Outlook is scheduled for Tuesday. Investors will be watching its assessment of global growth, debt and trade risks. With energy prices elevated and financing costs high, there is opportunity on one side and mounting pressure on the other."},{"id":"watchlist","role":"LASSE","avatarId":"de9f36c26bd841c891489a0c9d6174de","groupId":"46782f6d3de64ed98cec7f47d3d21ae7","voiceId":"00e3d285aba44b27a83c47c02c9c2d9c","voiceName":"Orson","gender":"male","script":"Here are the three signals I'm watching: banks' credit-loss provisions, Wednesday's inflation reading compared with forecasts, and whether oil stays elevated. Strong earnings could lift confidence. Hotter inflation or weaker company guidance could reverse it. None of those outcomes is assured, and we will separate results from expectations."},{"id":"signoff","role":"LIZA","avatarId":"5ee67ac453c34ffebd71e8eedb47b2fe","groupId":"3727ecd034ef4248afea2a3443f7d2b7","voiceId":"330290724a1b470fb63153f34d4c0183","voiceName":"Annie","gender":"female","script":"That is the Market Watch briefing for Monday, October twelfth. The next moves depend on data still to come, not only the headlines already on our screens. I'm Liza, with Lasse. Thanks for watching Signal Market Watch. We'll see you at the next update."}];
          if(!key||key.length<12||!gh||process.env.GITHUB_REPOSITORY!==repo||
            process.env.GITHUB_REF!=='refs/heads/ops/jazz-formal-anchors-20261012')
            throw Error('Invalid trusted account/branch context; no billable call');
          if(takes.length!==6||new Set(takes.map(x=>x.id)).size!==6)
            throw Error('Exactly six final news segments expected');
          const maxNewUsdPlanning=2.50;
          const budgetReserveUsd=takes.length*0.4;
          if(budgetReserveUsd>maxNewUsdPlanning)throw Error('Internal reserve higher than authorized amount');
          await mkdir('r4plus-voice-ledger',{recursive:true});
          const entries=[];
          const save=async()=>writeFile('r4plus-voice-ledger/ledger.json',JSON.stringify({
            project:'SIGNAL Market Watch / October 12 R4+',
            estimatedReserveUSD:budgetReserveUsd,providerHardSpendCap:false,
            purpose:'six new editorial news clips; three prior dated-news voices reused',
            results:entries},null,2));
          async function get(route){
           const url=new URL('https://api.heygen.com'+route);
           const r=await fetch(url,{method:'GET',headers:{'X-Api-Key':key,Accept:'application/json'},
             redirect:'error',signal:AbortSignal.timeout(25000)});
           if(!r.ok)throw Error('HeyGen read-only verification '+route.split('?')[0]+' HTTP '+r.status);
           const payload=await r.json();
           if(payload?.error)throw Error('HeyGen API read verification error');
           return payload.data??payload;
          }
          const account=await get('/v3/users/me');
          if(!account||typeof account!=='object')throw Error('API account not authorized');
          if([account.wallet?.auto_reload,account.wallet?.auto_reload_enabled,account.api_wallet?.auto_reload_enabled,
              account.billing?.auto_reload_enabled].some(x=>x===true))
            throw Error('Automatic wallet recharge detected; paid generation blocked');
          for(const role of ['LIZA','LASSE']){
           const t=takes.find(x=>x.role===role);
           const look=await get('/v3/avatars/looks/'+t.avatarId);
           if(look.id!==t.avatarId||look.group_id!==t.groupId||look.avatar_type!=='photo_avatar'||
              look.status!=='completed'||!look.supported_api_engines?.includes('avatar_iii')||
              !(look.image_width>look.image_height))
              throw Error('Business-formal '+role+' photo look unavailable');
           let found=false,cursor=null;
           for(let n=0;n<4;n++){
             const u=new URL('https://api.heygen.com/v3/voices');
             for(const [k,v] of Object.entries({engine:'starfish',type:'public',gender:t.gender,
               language:'English',limit:'100',search_query:t.voiceName}))u.searchParams.set(k,v);
             if(cursor)u.searchParams.set('token',cursor);
             const response=await get(u.pathname+u.search);
             const items=Array.isArray(response)?response:Array.isArray(response.items)?response.items:
               Array.isArray(response.voices)?response.voices:[];
             found=items.some(v=>v.voice_id===t.voiceId&&v.gender===t.gender&&v.language==='English');
             if(found||!response.next_token||response.next_token===cursor)break;
             cursor=response.next_token;
           }
           if(!found)throw Error(role+' exact chosen Starfish voice cannot be verified');
          }
          console.log('FREE PREFLIGHT PASS: exact user-locked Liza/Annie and Lasse/Orson confirmed');
          for(const t of takes){
           const w=t.script.trim().split(/\s+/).length;
           if(w<25||w>55||t.script.length>450)throw Error('Script not bounded for '+t.id);
           if(!['LIZA','LASSE'].includes(t.role))throw Error('Unexpected cast');
           if(!t.script.includes(' ')||/live price quote|guaranteed earnings/i.test(t.script))throw Error('Invalid script');
           const sig=createHash('sha256').update(JSON.stringify({
            id:t.id,avatar:t.avatarId,voice:t.voiceId,text:t.script,
            engine:'avatar_iii',resolution:'1080p',version:'r4plus-20261012'})).digest('hex').slice(0,14);
           const tag='refs/tags/signal-r4plus-oct12-'+t.id+'-'+sig+'-paid-once';
           const lock=await fetch('https://api.github.com/repos/'+repo+'/git/refs',{
             method:'POST',headers:{Authorization:'Bearer '+gh,'Content-Type':'application/json',
               Accept:'application/vnd.github+json','X-GitHub-Api-Version':'2022-11-28'},
             redirect:'error',signal:AbortSignal.timeout(20000),
             body:JSON.stringify({ref:tag,sha:process.env.GITHUB_SHA})});
           if(lock.status===422){
             console.log('Existing charged-attempt marker; refusing repeat '+t.id);
             entries.push({id:t.id,tag,status:'skipped_already_attempted'});await save();continue;
           }
           if(lock.status!==201)throw Error('Could not acquire one-time paid guard for '+t.id+'; no provider POST');
           const e={id:t.id,role:t.role,tag,status:'lock_created_submission_outcome_uncertain'};
           entries.push(e);await save();
           const body={type:'avatar',avatar_id:t.avatarId,voice_id:t.voiceId,script:t.script,
             engine:{type:'avatar_iii'},aspect_ratio:'16:9',resolution:'1080p',fit:'cover',
             title:'SIGNAL R4PLUS 2026-10-12 '+t.id+' '+sig,
             callback_id:'signal-r4plus-oct12-'+t.id+'-'+sig};
           let result;
           try{
            const response=await fetch('https://api.heygen.com/v3/videos',{
              method:'POST',headers:{'X-Api-Key':key,'Content-Type':'application/json',Accept:'application/json'},
              body:JSON.stringify(body),redirect:'error',signal:AbortSignal.timeout(120000)});
            if(!response.ok)throw Error('Provider HTTP '+response.status+
               '. No automatic retry; check prepaid wallet and existing video jobs.');
            result=await response.json();
           }catch(err){console.log('Stopped after unknown/rejected provider POST for '+t.id);await save();throw err;}
           const videoId=result?.data?.video_id??result?.video_id;
           if(typeof videoId!=='string'||videoId.length<8)throw Error('Provider accepted unknown ID; no repeat allowed');
           e.status='submitted';e.videoId=videoId;await save();
           console.log('ACCEPTED '+t.id+' '+videoId);
          }
          for(const e of entries.filter(x=>x.videoId)){
           let finished=false;
           for(let k=0;k<36;k++){
             await wait(12000);
             let v;try{v=await get('/v3/videos/'+encodeURIComponent(e.videoId));}catch{continue;}
             if(['completed','failed','error','cancelled','canceled'].includes(v.status)){
               e.status=v.status;e.durationSeconds=Number(v.duration)||null;
               e.error_code=v.failure_code||v.error_code||undefined;
               await save();console.log('VIDEO RESULT '+e.id+' '+e.status+' '+e.durationSeconds+'s');
               finished=true;break;
             }
           }
           if(!finished)console.log('Still processing '+e.id+' — do not retry, check provider ID');
          }
          if(entries.some(e=>e.status!=='completed'))
            throw Error('Not all six footage files completed. Ledger preserved. No paid retries.');
          console.log('ALL SIX EXACT LIZA/LASSE NEWS VIDEOS COMPLETED — NO REPEATED PAID POSTS');
          NODE
      - name: Preserve accepted job IDs and billing state even on partial failure
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: SIGNAL-R4plus-six-new-voice-scene-ledger
          path: r4plus-voice-ledger/
          if-no-files-found: warn
          retention-days: 30
