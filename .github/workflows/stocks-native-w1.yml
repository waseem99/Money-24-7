name: Stocks Native Newsroom — one physically coherent AI scene test
on:
  pull_request:
    paths:
      - '.github/workflows/stocks-native-w1.yml'
jobs:
  generate-native-once:
    if: github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    timeout-minutes: 19
    permissions:
      contents: write
    env:
      HEYGEN_API_KEY: ${{ secrets.HEYGEN_API_KEY }}
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: One user-authorized 5-second native newsroom clip (not a presentation composite)
        run: node pilot/stocks/native-scene-test.mjs
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: stocks-native-physical-newsroom-w1
          path: |
            stocks-cinematic-report.json
            stocks-cinematic-w1-completed.mp4
          retention-days: 14
