name: Stocks authorized identity audition
on:
  push:
    branches: [feat/stocks-production-roadmap-20261019]
    paths: [.github/workflows/stocks-authorized-audition.yml]
permissions:
  contents: write
concurrency:
  group: stocks-identity-audition-20261019
  cancel-in-progress: false
jobs:
  render:
    if: github.repository == 'waseem99/Money-24-7' && github.ref == 'refs/heads/feat/stocks-production-roadmap-20261019'
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
        with:
          ref: 14553eac82befebdf5cac0af221edaa3b113276d
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: sudo apt-get update -qq && sudo apt-get install -y ffmpeg
      - name: Acquire permanent single-attempt lock
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh api repos/waseem99/Money-24-7/git/refs -f ref=refs/tags/stocks-identity-audition-20261019-once -f sha=14553eac82befebdf5cac0af221edaa3b113276d
      - name: Generate authorized four-clip audition
        env:
          HEYGEN_API_KEY: ${{ secrets.HEYGEN_API_KEY }}
        run: node production/audition/run-once.mjs
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: stocks-identity-audition-20261019
          path: audition-output/
          retention-days: 30
