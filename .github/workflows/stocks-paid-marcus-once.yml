name: Stocks — one Marcus speaking take
on:
  workflow_dispatch:
jobs:
  one-authorized-take:
    # Explicitly disabled in G0–G3: unlock only in a separate reviewed, budget-authorized change.
    if: ${{ false }}
    runs-on: ubuntu-latest
    timeout-minutes: 4
    permissions:
      contents: write
    env:
      HEYGEN_API_KEY: ${{ secrets.HEYGEN_API_KEY }}
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - name: One locked Studio Avatar III attempt, no automatic retries
        run: node pilot/stocks/paid-marcus-once.mjs
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: stocks-marcus-locked-direct-api-receipt
          path: stocks-marcus-receipt.json
          retention-days: 30
