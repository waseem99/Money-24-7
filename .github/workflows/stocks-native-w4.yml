name: Stocks W4 - true scene reference and exact female audio
on:
  pull_request:
    paths:
      - '.github/workflows/stocks-native-w4.yml'
jobs:
  cinematic-dialogue:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    permissions:
      contents: write
    env:
      HEYGEN_API_KEY: ${{ secrets.HEYGEN_API_KEY }}
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: One $-bounded, exact TTS audio, model-based reference-to-video test
        run: node pilot/stocks/native-w4-scene-voice.mjs
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: stocks-w4-real-newsroom-exact-audio-test
          path: |
            stocks-w4-audit.json
            stocks-w4-anchor-native-voice.mp4
          retention-days: 21
