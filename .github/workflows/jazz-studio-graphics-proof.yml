name: Signal V2 branded Rumi studio graphics proof — no new credits

on:
  push:
    branches:
      - ops/jazz-rumi-annie-20261012
    paths:
      - .github/workflows/jazz-studio-graphics-proof.yml

permissions:
  contents: read

concurrency:
  group: jazz-rumi-existing-video-studio-proof
  cancel-in-progress: false

jobs:
  overlay-existing-avatar-on-existing-broadcast-layout:
    if: github.ref == 'refs/heads/ops/jazz-rumi-annie-20261012'
    runs-on: ubuntu-latest
    timeout-minutes: 12
    env:
      HEYGEN_API_KEY: ${{ secrets.HEYGEN_API_KEY }}
    steps:
      - name: Check out the existing Signal broadcaster source from main
        uses: actions/checkout@v4
        with:
          ref: main
          persist-credentials: false
      - name: Node 24
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - name: Install existing renderer dependencies
        run: npm ci
      - name: Install FFmpeg and standard broadcast font
        shell: bash
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq ffmpeg fonts-dejavu-core >/dev/null
      - name: Check available media tools
        shell: bash
        run: |
          ffmpeg -version >/dev/null
          ffprobe -version >/dev/null
          echo 'FFmpeg and FFprobe available'
          mkdir -p studio-proof
      - name: Download prior completed Rumi video via GET only
        shell: bash
        run: |
          node --input-type=module <<'NODE'
          import {createWriteStream} from 'node:fs';
          import {pipeline} from 'node:stream/promises';
          import {Readable} from 'node:stream';
          const key=process.env.HEYGEN_API_KEY;
          const videoId='12186d2986911a13710d9298344c7ab5';
          if(!key||key.length<12)throw new Error('HeyGen API key unavailable, no source download');
          const r=await fetch('https://api.heygen.com/v3/videos/'+videoId,{
            method:'GET',headers:{'X-Api-Key':key,Accept:'application/json'},
            redirect:'error',signal:AbortSignal.timeout(25000)});
          if(!r.ok)throw new Error('Read-only video lookup returned HTTP '+r.status);
          const raw=await r.json();
          if(raw?.error)throw new Error('Provider GET failed; details intentionally hidden');
          const data=raw?.data??raw;
          if(data.status!=='completed'||data.video_id&&data.video_id!==videoId)
            throw new Error('Source video unavailable or identity mismatch');
          const url=data.video_url??data.videoUrl;
          if(!url)throw new Error('Provider response has no signed completed-video URL');
          const u=new URL(url);
          if(u.protocol!=='https:'||!['heygen.ai','heygen.com'].some(root=>u.hostname===root||u.hostname.endsWith('.'+root)))
            throw new Error('Unexpected media origin');
          const media=await fetch(url,{method:'GET',redirect:'follow',signal:AbortSignal.timeout(120000)});
          if(!media.ok||!media.body)throw new Error('Previously generated source media unavailable');
          const bytes=Number(media.headers.get('content-length')||0);
          if(bytes>100*1024*1024)throw new Error('Existing source media too large');
          await pipeline(Readable.fromWeb(media.body),createWriteStream('studio-proof/rumi-original.mp4'));
          console.log('PASS: previously authorized Rumi+Annie source downloaded through nonbillable GET');
          console.log('Source video ID: '+videoId);
          console.log('No HeyGen video creation or synthetic speech requested.');
          NODE
      - name: Render existing Signal V2 newsroom, headline and ticker background
        shell: bash
        run: |
          node --input-type=module <<'NODE'
          import sharp from 'sharp';
          import {renderSVG} from './src/broadcast/render.js';
          import {exampleProgramme} from './src/broadcast/fixtures.js';
          import {compileTimeline} from './src/broadcast/timeline.js';
          const p=exampleProgramme('sample');
          p.presenters[0].name='Rumi';
          p.presenters[0].role='Lead anchor';
          p.presenters[1].name='Kevin';
          p.presenters[1].role='Market analyst';
          p.scenes[0].headline='BEYOND THE HEADLINE';
          const timeline=compileTimeline(p,{}, {fixture:true});
          const svg=renderSVG(p,1500,timeline,{fixture:false,reducedMotion:true,overlays:true});
          await sharp(Buffer.from(svg)).png().toFile('studio-proof/studio-base.png');
          console.log('PASS: Existing V2 renderSVG composited brand SIGNAl header, presenter frame, lower-third, headline, simulated financial ticker and editorial source warning into the reusable background.');
          NODE
      - name: Composite the actual Rumi footage into existing Signal V2 presenter window
        shell: bash
        run: |
          ffmpeg -hide_banner -v error -y \
            -loop 1 -framerate 30 -i studio-proof/studio-base.png \
            -i studio-proof/rumi-original.mp4 \
            -filter_complex "[1:v]fps=30,scale=520:-2:flags=lanczos,crop=520:612:0:0,format=yuv420p[anchor];[0:v][anchor]overlay=x=345:y=165:shortest=1:format=auto,format=yuv420p[out]" \
            -map "[out]" -map 1:a:0 \
            -t 10.84 -r 30 -c:v libx264 -preset veryfast -crf 21 -pix_fmt yuv420p \
            -c:a aac -b:a 160k -ar 48000 \
            -movflags +faststart studio-proof/Signal-Rumi-Broadcast-Graphics-Proof.mp4
          ffmpeg -hide_banner -v error -y -ss 3 -i studio-proof/Signal-Rumi-Broadcast-Graphics-Proof.mp4 -frames:v 1 -update 1 studio-proof/studio-preview.png
          printf '%s\n' \
            'SIGNAL V2 PRODUCTION GRAPHICS PROOF — NOT A FINISHED PROGRAMME' \
            'Uses previously generated public HeyGen digital-twin footage: Rumi + Annie video 12186d2986911a13710d9298344c7ab5.' \
            'Studio background, headline, lower-third, source disclosure, and ticker generated from the existing Signal V2 renderer on main.' \
            'FORMAL WARDROBE NOT SOLVED: the original Rumi video appearance is unchanged.' \
            'The broadcaster graphics are a static ten-second demonstration; the three-minute scene animations and Kevin footage have not been integrated.' \
            'ILLUSTRATIVE/SIMULATED financial ticker. No real/live prices are represented.' \
            'No new HeyGen generation, ElevenLabs calls or credit spend in this workflow.' \
            > studio-proof/README-PLEASE-READ.txt
          ffprobe -v error -show_entries format=duration -show_entries stream=codec_type,width,height \
            -of json studio-proof/Signal-Rumi-Broadcast-Graphics-Proof.mp4
      - name: Upload a user-reviewable studio graphics proof
        uses: actions/upload-artifact@v4
        with:
          name: Signal-V2-Rumi-studio-graphics-proof
          path: |
            studio-proof/Signal-Rumi-Broadcast-Graphics-Proof.mp4
            studio-proof/studio-preview.png
            studio-proof/README-PLEASE-READ.txt
          if-no-files-found: error
          retention-days: 14
