name: Pilot validation
on:
  pull_request:
  push:
    branches: [main]
jobs:
  contracts-and-app:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm test
      - run: npm run build
      - name: Validate isolated Stocks streaming operator bundle (no provider request)
        run: STOCKS_BUILD_OPERATOR_LAB=true npm run build -- --outDir dist-operator-lab
      - run: sudo apt-get update && sudo apt-get install -y ffmpeg fonts-dejavu-core
      - run: npm run verify:media
      - run: npm run verify:broadcast
      - run: node pilot/v2/verify-native.mjs
